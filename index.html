<html lang="fr">
<head>

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316151E'/%3E%3Ctext x='16' y='23' font-family='Arial' font-weight='700' font-size='19' fill='white' text-anchor='middle'%3ET%3C/text%3E%3Ccircle cx='25' cy='7' r='3' fill='%23E0533D'/%3E%3C/svg%3E">
<title>Studio Tefi</title>

<style>
/* Layout: régie de production — barre latérale (bureau) / barre d'onglets (mobile), contenu en panneaux, éditeur en volet latéral */
:root{
  --bg:#F5F5FA; --surface:#FFFFFF; --surface-2:#ECECF3; --line:#DDDDE7; --fg:#16151E; --muted:#676577;
  --accent:#4636D9; --accent-fg:#FFFFFF; --accent-soft:#E7E4FF;
  --late:#D2402C; --ok:#118A6B; --warn:#B98300;
  --shadow:0 1px 2px rgba(22,21,30,.06),0 8px 24px rgba(22,21,30,.06);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-script:"Courier Prime","Courier New",Courier,monospace;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0E14; --surface:#17161F; --surface-2:#211F2C; --line:#2E2C3B; --fg:#ECEBF4; --muted:#9C9AAE;
  --accent:#9389FF; --accent-fg:#0E0E14; --accent-soft:#25214A;
  --late:#FF6E5A; --ok:#33C79F; --warn:#F0B429; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0E14; --surface:#17161F; --surface-2:#211F2C; --line:#2E2C3B; --fg:#ECEBF4; --muted:#9C9AAE;
  --accent:#9389FF; --accent-fg:#0E0E14; --accent-soft:#25214A;
  --late:#FF6E5A; --ok:#33C79F; --warn:#F0B429; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(26px,4vw,34px);font-weight:800}
h2{font-size:19px;font-weight:700}
h3{font-size:15px;font-weight:700}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.label{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
svg{width:20px;height:20px;flex:none}

/* Shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.nav{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:4px;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 18px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;position:relative}
.brand-mark::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--late)}
.brand b{font-family:var(--f-display);font-size:18px;font-weight:800;letter-spacing:-.02em}
.nav-btn{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;border-radius:9px;background:none;color:var(--muted);font-weight:500;text-align:left}
.nav-btn:hover{background:var(--surface-2);color:var(--fg)}
.nav-btn[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-btn .count{margin-left:auto;font-family:var(--f-mono);font-size:11px;background:var(--surface-2);color:var(--muted);padding:1px 7px;border-radius:20px}
.nav-new{margin-top:14px;justify-content:center;background:var(--fg);color:var(--bg);font-weight:600}
.nav-new:hover{background:var(--fg);color:var(--bg);opacity:.9}
.sync{margin-top:auto;padding:10px 12px;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);margin-top:5px;flex:none}
.sync.cloud i{background:var(--ok)} .sync.local i{background:var(--warn)}
main{min-width:0;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
@media (min-width:900px){main{padding-left:40px;padding-right:max(40px,env(safe-area-inset-right,0px))}}
.fab{display:none}
.nav-btn .sm{display:none}
@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr)}
  .nav{position:fixed;inset:auto 0 0 0;top:auto;height:auto;flex-direction:row;justify-content:space-around;gap:0;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));border-right:0;border-top:1px solid var(--line);z-index:30}
  .brand,.sync,.nav-new{display:none}
  .nav-btn{flex-direction:column;gap:3px;font-size:11px;padding:6px 4px;flex:1;align-items:center;text-align:center}
  .nav-btn .count{display:none}
  .nav-btn .lg{display:none}.nav-btn .sm{display:inline}
  .nav-btn[aria-current="page"]{background:none}
  main{padding-block:18px calc(110px + env(safe-area-inset-bottom,0px))}
  .fab{display:grid;place-items:center;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:16px;border:0;background:var(--fg);color:var(--bg);box-shadow:var(--shadow);z-index:29}
  .fab svg{width:24px;height:24px}
}

/* Generic UI */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head p{margin:4px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--late)}
.btn.danger[data-armed="1"]{background:var(--late);color:#fff;border-color:var(--late)}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.icon-btn:hover{border-color:var(--muted)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.inp{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:70px}
select.inp{padding-right:28px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select{width:auto;max-width:100%;padding:6px 26px 6px 10px;font-size:13.5px;border-radius:20px}
.filters select.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c) 14%,transparent);color:color-mix(in srgb,var(--c) 75%,var(--fg));white-space:nowrap}
.pill.plain{background:var(--surface-2);color:var(--muted)}
.empty{padding:28px 18px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:17px;margin-bottom:4px}
.empty .btn{margin-top:12px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.grid-2,.grid-3{grid-template-columns:minmax(0,1fr)}}

/* Home */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px}
.stat:hover{border-color:var(--muted)}
.stat strong{font-family:var(--f-display);font-size:32px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat.alert strong{color:var(--late)}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.strip button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.strip button:hover{border-color:var(--muted)}
.strip .d{font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1}
.strip .is-today{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.strip .is-today .label{color:inherit;opacity:.7}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:8px;max-width:100%}
.dots .dot{width:7px;height:7px}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;background:none;border:0;padding:0;text-align:left}
.row-main b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.when{width:58px;flex:none;display:flex;flex-direction:column;align-items:flex-start}
.when b{font-family:var(--f-display);font-size:18px;line-height:1}
.when.late b{color:var(--late)}
.pipe{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface-2);gap:2px}
.pipe i{background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.acc-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.acc-row:first-child{border-top:0}
.acc-name{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600}
.acc-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv{display:flex;flex-direction:column;align-items:flex-end;font-size:12px;color:var(--muted)}
.kv b{font-family:var(--f-mono);font-size:14px;color:var(--fg)}
.onboard ol{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* Calendar */
.cal-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-title{font-family:var(--f-display);font-weight:700;font-size:21px;min-width:0;text-transform:capitalize;margin:0 6px}
.toggle{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--muted);cursor:pointer}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.dow{background:var(--surface-2);padding:7px 8px;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.day{background:var(--surface);min-height:118px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer;position:relative}
.day.out{background:var(--bg)}
.day.out .num{opacity:.45}
.day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.day.drop{background:var(--accent-soft)}
.num{font-family:var(--f-mono);font-size:12px;font-weight:500;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.day.today .num{background:var(--late);color:#fff}
.ev{display:flex;align-items:center;gap:5px;width:100%;min-width:0;border:0;border-radius:5px;padding:3px 6px;font-size:12px;text-align:left;background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--fg);cursor:pointer;line-height:1.3}
.ev:hover{background:color-mix(in srgb,var(--c) 26%,var(--surface))}
.ev .t{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);flex:none}
.ev .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.ev.prod{background:none;border:1px dashed color-mix(in srgb,var(--fg) 25%,transparent);color:var(--muted)}
.ev.done .n{text-decoration:line-through;opacity:.6}
.ev.late{box-shadow:inset 2px 0 0 var(--late)}
.more{font-size:11.5px;color:var(--muted);padding-left:4px}
@media (max-width:640px){
  .day{min-height:64px;padding:4px;gap:2px;align-items:center}
  .day .ev{height:5px;padding:0;border-radius:3px;background:var(--c)}
  .day .ev.prod{border:0;background:color-mix(in srgb,var(--fg) 25%,transparent)}
  .day .ev .t,.day .ev .n{display:none}
  .dow{padding:6px 2px;text-align:center;font-size:10.5px}
}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wcol{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;min-height:260px;display:flex;flex-direction:column;gap:5px;min-width:0}
.wcol.today{border-color:var(--late)}
.wcol.drop{background:var(--accent-soft)}
.wcol-h{display:flex;justify-content:space-between;align-items:baseline;padding:2px 2px 6px;border-bottom:1px solid var(--line);margin-bottom:3px}
.wcol-h b{font-family:var(--f-display);font-size:20px}
.wcol .ev{flex-direction:column;align-items:flex-start;gap:1px;padding:6px 7px}
.wcol .ev .n{white-space:normal}
@media (max-width:899px){.week{grid-template-columns:minmax(0,1fr)}.wcol{min-height:0}.wcol .ev{flex-direction:row;align-items:center}}
.agenda{display:flex;flex-direction:column;gap:16px}
.agenda-day{display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px}
@media (max-width:560px){.agenda-day{grid-template-columns:minmax(0,1fr);gap:6px}}
.agenda-date{padding-top:10px}
.agenda-date b{font-family:var(--f-display);font-size:22px;display:block;line-height:1}
.daypanel .row{padding:11px 2px}
.tag-kind{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}

/* Board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px;scroll-snap-align:start;min-width:0}
.col.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.col-h{display:flex;align-items:center;gap:8px;padding:2px 4px 4px;font-weight:600}
.col-h .mono{margin-left:auto;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:11px 12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-width:0}
.card:hover{border-color:var(--muted)}
.card-t{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.card-f{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.card-b{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip-acc{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:5px;padding:2px 7px;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip-acc.late{color:var(--late)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
.search{position:relative;flex:1;min-width:180px;max-width:340px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);width:17px;height:17px}
.search .inp{padding-left:34px}

/* Ideas */
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick .inp:first-child{flex:1;min-width:200px}
.quick select{width:auto}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.idea p{margin:0;color:var(--muted);font-size:14px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.idea .card-b{margin-top:auto}

/* Settings */
.set-list{display:flex;flex-direction:column;gap:8px}
.set-item{display:flex;align-items:center;gap:8px;min-width:0}
.set-item .inp{flex:1}
.swatch{width:34px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--surface);flex:none;cursor:pointer}
.plat-group{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.plat-group:first-child{border-top:0;padding-top:0}
.add-form{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.add-form .inp{flex:1;min-width:140px}
.add-form select.inp{flex:0 1 auto;width:auto}

/* Editor sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end;background:color-mix(in srgb,#000 38%,transparent)}
.sheet-panel{width:min(780px,100%);height:100%;background:var(--bg);display:flex;flex-direction:column;box-shadow:var(--shadow);animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}

.sheet-top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.saved{font-size:12.5px;color:var(--muted);margin-right:auto;display:flex;align-items:center;gap:6px}
.saved i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.saved.pending i{background:var(--warn)}
.sheet-body{flex:1;overflow-y:auto;padding:22px max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px}
@media (min-width:700px){.sheet-body{padding-left:32px;padding-right:32px}}
.title-inp{font-family:var(--f-display);font-size:clamp(24px,4vw,30px);font-weight:800;border:0;background:none;padding:2px 0;width:100%;letter-spacing:-.015em}
.title-inp:focus{outline:none}
.title-inp::placeholder{color:var(--muted);opacity:.6}
.ed-sec{display:flex;flex-direction:column;gap:12px}
.ed-sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.status-pick{display:flex;flex-wrap:wrap;gap:6px}
.status-pick button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 12px;font-size:13.5px;font-weight:500}
.status-pick button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.status-pick button[aria-pressed="true"] .dot{background:#fff}
.pub{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) 104px auto auto;grid-template-areas:'acc date time done x';gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px}
.pub.isdone{opacity:.7}
.pub-done{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap;cursor:pointer}
.pub-done input{accent-color:var(--ok);width:17px;height:17px}
.pub-acc{grid-area:acc;min-width:0}.pub>[data-pf=date]{grid-area:date}.pub>[data-pf=time]{grid-area:time}.pub-done{grid-area:done}.pub>.icon-btn{grid-area:x}
@media (max-width:620px){.pub{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;grid-template-areas:'acc acc x' 'date time done'}}
.f-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:620px){.f-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.f-grid .wide{grid-column:1 / -1}
.scene{background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.scene-h{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.scene-h input{flex:1;border:0;background:none;font-family:var(--f-script);font-weight:700;text-transform:uppercase;font-size:14px;padding:4px 0;min-width:0}
.scene-h input:focus{outline:none}
.scene textarea{display:block;width:100%;border:0;background:var(--surface);font-family:var(--f-script);font-size:15px;line-height:1.6;padding:14px 16px;min-height:150px;resize:vertical}
.scene textarea:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent-soft)}
.hint{font-size:12.5px;color:var(--muted)}
.ed-foot{display:flex;flex-wrap:wrap;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:14px;z-index:80;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@media (min-width:900px){.toast{bottom:28px}}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
/* v2 */
.stats{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stats .stat:first-child{grid-column:1 / -1}}
.stat[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.strip button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.strip .is-today[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.netbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.acc-chip{display:inline-flex;align-items:center;gap:7px;padding:5px 10px 5px 9px;border:1px solid var(--line);border-radius:20px;background:var(--surface);font-size:13.5px;font-weight:500;max-width:100%}

.nat{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.nat.pro{background:var(--fg);color:var(--bg)}

.quick-acc{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

.row-acts{display:flex;gap:4px;flex:none;align-items:center}
.icon-btn.sm{width:32px;height:32px}

.icon-btn.danger{color:var(--late)}
.icon-btn[data-armed="1"]{width:auto;padding:0 10px;background:var(--late);color:#fff;border-color:var(--late);font-size:12.5px;font-weight:600}
.peek{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,#000 42%,transparent);padding:16px}
.peek-panel{width:min(620px,100%);max-height:100%;overflow-y:auto;background:var(--bg);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(12px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.peek-panel{animation:none}}
@media (max-width:640px){.peek{align-items:flex-end;padding:0}.peek-panel{border-radius:16px 16px 0 0;max-height:92%}}
.peek-h{display:flex;gap:12px;align-items:flex-start;padding:16px 18px 14px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:2}
.peek-h h2{font-size:22px;font-weight:800;overflow-wrap:anywhere}
.peek-b{padding:16px 18px;display:flex;flex-direction:column;gap:18px}
.peek-f{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);position:sticky;bottom:0}
.peek-f .btn.primary{margin-right:auto}
.ppub{display:grid;grid-template-columns:minmax(0,1fr) 140px 92px auto auto;grid-template-areas:'acc date time done x';gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 8px 8px 12px}
.ppub .acc{grid-area:acc;display:flex;align-items:center;gap:7px;min-width:0;font-weight:600;font-size:14px}
.ppub .acc span.h{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ppub>[data-ppf=date]{grid-area:date}.ppub>[data-ppf=time]{grid-area:time}.ppub .pub-done{grid-area:done}.ppub>.icon-btn{grid-area:x;justify-self:end}
.ppub.late{border-color:var(--late)}
@media (max-width:560px){.ppub{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;grid-template-areas:'acc acc x' 'date time done'}}
.kvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 16px}
.kvs div{display:flex;flex-direction:column;gap:1px;min-width:0}
.kvs b{font-weight:500;overflow-wrap:anywhere}
.script-ex{font-family:var(--f-script);white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:12px 14px;font-size:14px;line-height:1.55;max-height:200px;overflow:auto;margin:0;overflow-wrap:anywhere}
.theme-pick{display:flex;flex-wrap:wrap;gap:6px}
.theme-pick button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 11px;font-size:13px;font-weight:500;color:var(--muted)}
.theme-pick button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.hist{display:flex;flex-direction:column}
.hist-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.hist-row:first-child{border-top:0}
.hist-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);font-size:15px;font-weight:700}
.hist-ic.create{color:var(--ok)}.hist-ic.delete{color:var(--late)}.hist-ic.restore{color:var(--accent)}
.hist-row b{font-weight:600;overflow-wrap:anywhere}
.ver{padding:12px 0;border-top:1px solid var(--line)}
.ver:first-child{border-top:0;padding-top:0}

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const a=String(s).split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d);};
const today=()=>ds(new Date());
const dow=s=>(pd(s).getDay()+6)%7;
const weekStart=s=>addDays(s,-dow(s));

const fmtDay=s=>{const d=pd(s);return DAYS_LONG[dow(s)]+' '+d.getDate()+' '+MONTHS[d.getMonth()];};
const fmtShort=s=>{const d=pd(s);return d.getDate()+' '+MSHORT[d.getMonth()];};
const fmtStamp=t=>{const d=new Date(t);return d.getDate()+' '+MSHORT[d.getMonth()]+' · '+pad(d.getHours())+':'+pad(d.getMinutes());};
const rel=s=>{const n=diffDays(s,today());if(n===0)return "aujourd'hui";if(n===1)return 'demain';if(n===-1)return 'hier';return n>0?'dans '+n+' j':'il y a '+(-n)+' j';};

const plural=(n,a,b)=>n+' '+(n>1?(b||a+'s'):a);

const toMap=a=>{const m={};(a||[]).forEach(x=>{if(x&&x.id)m[x.id]=x;});return m;};

const typeOf=id=>settings().types.find(t=>t.id===id)||{id:'',label:'Sans format',color:'#8A8FA3'};
const themeOf=id=>settings().themes.find(t=>t.id===id);
const platOf=id=>settings().platforms.find(p=>p.id===id)||{id:'',label:'Plateforme ?',color:'#8A8FA3',channel:'social'};
const chanOf=id=>settings().channels.find(c=>c.id===id)||{id:id||'',label:'Autre'};

function pubChannel(p){const a=S.accounts[p.accountId];return a?(platOf(a.platform).channel||'social'):(p.channel||'');}
function distOf(c){const out=[];(c.publications||[]).forEach(p=>{const ch=pubChannel(p);if(ch&&!out.includes(ch))out.push(ch);});return out;}

function normContent(c){c=Object.assign({title:'',type:'',themes:[],status:'ecriture',publications:[],shoots:null,editDate:'',duration:'',cast:'',gear:'',scenes:[],caption:'',hashtags:'',notes:''},c);

/* ================= Stockage ================= */
let DB=null;
const wq=new Map();
function enqueue(key,job){const e=wq.get(key)||{busy:false,next:null};e.next=job;wq.set(key,e);if(!e.busy)pump(e);}
async function pump(e){e.busy=true;while(e.next){const j=e.next;e.next=null;try{await j();}catch(err){writeError(err);}}e.busy=false;}
function writeError(err){
  const code=err&&err.code;
  if(code==='invalid_argument')toast("Modification refusée : tu n'as pas le droit d'écrire ici.");
  else if(code==='quota_exceeded')toast("Espace plein : supprime d'anciens contenus pour continuer.");
  else if(code==='unavailable')toast('Connexion instable, réessaie dans un instant.');
  else toast('Enregistrement impossible ('+(code||'erreur')+').');
}
function localPayload(){return {contents:S.contents,accounts:S.accounts,rdv:S.rdv,docs:S.docs,settings:S.settings,history:S.history.slice(0,HMAX_LOCAL)};}
function persistLocal(){if(S.mode!=='local')return;if(!lsSet(LS_DATA,localPayload()))toast("Stockage du navigateur plein : exporte une sauvegarde.");Sync.schedulePush();}
const Store={
  saveContent(c){c=clone(c);c.updatedAt=Date.now();S.contents[c.id]=c;
    if(S.mode==='cloud')enqueue('c:'+c.id,()=>DB.collection('contents').doc(c.id).set(c));else persistLocal();scheduleRender();},
  deleteContent(id){delete S.contents[id];
    if(S.mode==='cloud')enqueue('c:'+id,()=>DB.collection('contents').doc(id).delete());else persistLocal();scheduleRender();},
  saveAccount(a){a=clone(a);S.accounts[a.id]=a;
    if(S.mode==='cloud')enqueue('a:'+a.id,()=>DB.collection('accounts').doc(a.id).set(a));else persistLocal();scheduleRender();},
  deleteAccount(id){delete S.accounts[id];
    if(S.mode==='cloud')enqueue('a:'+id,()=>DB.collection('accounts').doc(id).delete());else persistLocal();scheduleRender();},
  saveRdv(x){x=clone(x);x.updatedAt=Date.now();S.rdv[x.id]=x;
    if(S.mode==='cloud')enqueue('r:'+x.id,()=>DB.collection('rdv').doc(x.id).set(x));else persistLocal();scheduleRender();},
  deleteRdv(id){delete S.rdv[id];
    if(S.mode==='cloud')enqueue('r:'+id,()=>DB.collection('rdv').doc(id).delete());else persistLocal();scheduleRender();},
  saveSettings(s){S.settings=clone(s);
    if(S.mode==='cloud')enqueue('settings',()=>DB.doc('settings/main').set(clone(s)));else persistLocal();scheduleRender();},
  addHistory(e){
    S.history=[e].concat(S.history.filter(x=>x.id!==e.id));
    if(S.mode==='cloud'){
      enqueue('h:'+e.id,()=>DB.collection('history').doc(e.id).set(e));
      const extra=S.history.slice(HMAX_CLOUD);S.history=S.history.slice(0,HMAX_CLOUD);
      extra.forEach(x=>enqueue('h:'+x.id,()=>DB.collection('history').doc(x.id).delete()));
    }else{S.history=S.history.slice(0,HMAX_LOCAL);persistLocal();}
  }
};
function logChange(kind,action,refId,label,summary,before){
  Store.addHistory({id:'h'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),at:Date.now(),kind,action,refId:refId||'',label:label||'',summary:summary||'',by:ROLE==='assistant'?roleName('assistant'):'Admin',before:before?clone(before):null});
}
async function startStore(){
  let db=null;
  if(window.claude&&typeof window.claude.use==='function'){try{db=await window.claude.use('db');}catch(e){db=null;}}
  if(db){
    DB=db;S.mode='cloud';
    let got=0;const ready=()=>{if(++got===6){S.loaded=true;afterLoad();}};
    setTimeout(()=>{if(!S.loaded){S.loaded=true;afterLoad();scheduleRender();}},6000);
    const onErr=e=>{if(e&&e.code!=='revoked')toast('Synchronisation interrompue. Recharge la page.');};
    db.collection('contents').onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=normContent(Object.assign({},clone(d.data()),{id:d.id}));});S.contents=o;ready();scheduleRender();},onErr);
    db.collection('accounts').onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=Object.assign({},clone(d.data()),{id:d.id});});S.accounts=o;ready();scheduleRender();},onErr);
    db.collection('docs').onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=Object.assign({},clone(d.data()),{id:d.id});});S.docs=o;ready();scheduleRender();},onErr);
    db.collection('rdv').onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=Object.assign({},clone(d.data()),{id:d.id});});S.rdv=o;ready();scheduleRender();},onErr);
    db.doc('settings/main').onSnapshot(snap=>{S.settings=snap.exists?clone(snap.data()):null;ready();scheduleRender();},onErr);
    db.collection('history').orderBy('at','desc').limit(HMAX_CLOUD).onSnapshot(snap=>{S.history=snap.docs.map(d=>Object.assign({},clone(d.data()),{id:d.id}));ready();scheduleRender();},onErr);
  }else{
    S.mode='local';
    applyLocal(lsGet(LS_DATA)||{});
    S.loaded=true;afterLoad();
    Sync.init();
  }
  renderSync();scheduleRender();
}
function applyLocal(d){
  S.contents={};Object.values(Array.isArray(d.contents)?toMap(d.contents):(d.contents||{})).forEach(c=>{S.contents[c.id]=normContent(c);});
  S.accounts=Array.isArray(d.accounts)?toMap(d.accounts):(d.accounts||{});
  S.rdv=Array.isArray(d.rdv)?toMap(d.rdv):(d.rdv||{});
  S.docs=Array.isArray(d.docs)?toMap(d.docs):(d.docs||{});
  S.settings=d.settings||null;S.history=Array.isArray(d.history)?d.history:[];
}
function afterLoad(){if(!hashView&&!Object.keys(S.accounts).length){S.ui.view='networks';}}
function renderSync(){
  const el=$('#sync');
  if(S.mode==='cloud'){el.className='sync cloud';el.innerHTML='<i></i><span>Synchronisé sur tous tes appareils · v'+APP_VERSION+'</span>';}
  else if(S.mode==='local'){
    if(Sync.cfg&&Sync.cfg.gistId){el.className='sync '+(Sync.state==='error'?'local':'cloud');el.innerHTML='<i></i><span>'+esc(Sync.label())+' · v'+APP_VERSION+'</span>';}
    else{el.className='sync local';el.innerHTML='<i></i><span>Enregistré sur cet appareil seulement. Active la synchro GitHub dans Réglages. · v'+APP_VERSION+'</span>';}
  }
}

/* ================= Synchro GitHub (Gist) — version GitHub Pages ================= */
const GIST_FILE='studio-tefi.json';
const Sync={
  cfg:null,state:'off',pushT:null,dirty:false,lastAt:0,applying:false,
  label(){return this.state==='pushing'?'Envoi vers GitHub…':this.state==='pulling'?'Récupération depuis GitHub…':this.state==='error'?'Synchro GitHub en erreur':this.lastAt?'Synchronisé avec GitHub à '+pad(new Date(this.lastAt).getHours())+':'+pad(new Date(this.lastAt).getMinutes()):'Synchro GitHub active';},
  init(){this.cfg=lsGet(LS_GIST);if(this.cfg&&this.cfg.token&&this.cfg.gistId){this.pull();}
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&this.cfg&&this.cfg.gistId&&!this.dirty)this.pull();});
    setInterval(()=>{if(document.visibilityState==='visible'&&this.cfg&&this.cfg.gistId&&!this.dirty&&!draft&&this.state!=='pushing')this.pull();},60000);},
  headers(){return {'Authorization':'Bearer '+this.cfg.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'};},
  payload(){return JSON.stringify({app:'studio-tefi',version:1,savedAt:new Date().toISOString(),settings:S.settings,accounts:Object.values(S.accounts),rdv:Object.values(S.rdv),docs:Object.values(S.docs),contents:Object.values(S.contents),history:S.history.slice(0,100)});},
  set(state){this.state=state;renderSync();if(S.ui.view==='settings')scheduleRender();},
  async pull(){
    if(!this.cfg||!this.cfg.gistId)return;this.set('pulling');
    try{
      const r=await fetch('https://api.github.com/gists/'+encodeURIComponent(this.cfg.gistId),{headers:this.headers(),cache:'no-store'});
      if(!r.ok)throw new Error(r.status===401?'Jeton GitHub refusé':r.status===404?'Espace de synchro introuvable':'GitHub a répondu '+r.status);
      const g=await r.json();const f=g.files&&g.files[GIST_FILE];if(!f)throw new Error('Fichier de données absent');
      let text=f.content;if(f.truncated&&f.raw_url){text=await (await fetch(f.raw_url,{cache:'no-store'})).text();}
      const d=JSON.parse(text);if(d.app!=='studio-tefi')throw new Error('Données inconnues');
      if(this.dirty){this.set('ok');return;}
      applyLocal(d);lsSet(LS_DATA,localPayload());this.lastAt=Date.now();this.set('ok');scheduleRender();
    }catch(e){this.err=e.message||String(e);this.set('error');}
  },
  schedulePush(){if(!this.cfg||!this.cfg.gistId)return;this.dirty=true;clearTimeout(this.pushT);this.pushT=setTimeout(()=>this.push(),1500);},
  async push(){
    if(!this.cfg||!this.cfg.gistId)return;clearTimeout(this.pushT);this.set('pushing');
    try{const r=await fetch('https://api.github.com/gists/'+encodeURIComponent(this.cfg.gistId),{method:'PATCH',headers:this.headers(),body:JSON.stringify({files:{[GIST_FILE]:{content:this.payload()}}})});
      if(!r.ok)throw new Error(r.status===401?'Jeton GitHub refusé':'GitHub a répondu '+r.status);
      this.dirty=false;this.lastAt=Date.now();this.set('ok');
    }catch(e){this.err=e.message||String(e);this.set('error');}
  },
  async create(token){
    this.cfg={token};
    try{const r=await fetch('https://api.github.com/gists',{method:'POST',headers:this.headers(),body:JSON.stringify({description:'Studio Tefi — données (ne pas supprimer)',public:false,files:{[GIST_FILE]:{content:this.payload()}}})});
      if(!r.ok)throw new Error(r.status===401?'Jeton GitHub refusé : vérifie qu\'il a la permission « gist »':'GitHub a répondu '+r.status);
      const g=await r.json();this.cfg={token,gistId:g.id};lsSet(LS_GIST,this.cfg);this.lastAt=Date.now();this.set('ok');toast('Synchro GitHub activée');
    }catch(e){this.cfg=null;toast(e.message||'Échec de la création');this.set('off');}
  },
  async connect(token,gistId){this.cfg={token,gistId};this.dirty=false;await this.pull();
    if(this.state==='ok'){lsSet(LS_GIST,this.cfg);toast('Appareil connecté : planning récupéré');}else{toast(this.err||'Connexion impossible');this.cfg=null;this.set('off');}},
  disconnect(){try{localStorage.removeItem(LS_GIST);}catch(e){}this.cfg=null;this.set('off');toast('Synchro GitHub désactivée sur cet appareil');}
};

/* ================= Filtres & événements ================= */
function filtersActive(){const f=S.ui.filters;return Object.keys(f).some(k=>f[k]);}
function passAcc(a,p){const f=S.ui.filters;
  if(f.channel&&(a?(platOf(a.platform).channel||'social'):(p&&p.channel))!==f.channel)return false;
  if(f.account&&(!a||a.id!==f.account))return false;if(f.platform&&(!a||a.platform!==f.platform))return false;
  if(f.nature&&(!a||(a.nature||'')!==f.nature))return false;return true;}
function passContent(c){const f=S.ui.filters;if(f.type&&c.type!==f.type)return false;if(f.status&&c.status!==f.status)return false;
  if(f.theme&&!(c.themes||[]).includes(f.theme))return false;
  if(f.channel||f.account||f.platform||f.nature)return (c.publications||[]).some(p=>passAcc(S.accounts[p.accountId],p));return true;}
function events(opt){
  opt=Object.assign({filtered:true,prod:S.ui.showProd},opt||{});
  const out=[];
  for(const c of contents()){
    if(opt.filtered&&!passContent(c))continue;
    if(c.status==='idee')continue;
    for(const p of (c.publications||[])){
      if(!isValidDate(p.date))continue;const a=S.accounts[p.accountId];
      if(opt.filtered&&!passAcc(a,p))continue;
      out.push({kind:'pub',date:p.date,time:p.time||'',c,p,a});
    }
    if(opt.prod){
      (c.shoots||[]).forEach(s=>{if(!isValidDate(s.start))return;const n=Math.min(diffDays(shootEnd(s),s.start)+1,120);for(let i=0;i<n;i++)out.push({kind:'shoot',date:addDays(s.start,i),time:'',c,s,di:i,dn:n});});
      if(isValidDate(c.editDate))out.push({kind:'edit',date:c.editDate,time:'',c});
    }
  }
  if(opt.rdv!==false&&(opt.rdv||S.ui.showRdv)&&!(opt.filtered&&filtersActive())){
    Object.values(S.rdv).forEach(x=>{if(isValidDate(x.date))out.push({kind:'rdv',date:x.date,time:x.start||'',r:x});});
  }
  out.sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:(x.time||'99')<(y.time||'99')?-1:1);
  return out;
}
const isLate=e=>e.kind==='pub'&&e.p&&!e.p.done&&e.date<today();
function byDate(evs){const m={};evs.forEach(e=>{(m[e.date]=m[e.date]||[]).push(e);});return m;}
function evColor(e){return e.kind==='rdv'?rdvColor(e.r):e.kind==='pub'?accColor(e.a):typeOf(e.c.type).color;}
function evChip(e){
  if(e.kind==='rdv')return '<button class="ev rdv" style="--c:'+rdvColor(e.r)+'" draggable="true" data-drag="ev:rdv:'+esc(e.r.id)+'::'+e.date+'" data-act="rdv-open" data-id="'+esc(e.r.id)+'" title="'+esc('RDV · '+rdvWho(e.r)+' · '+e.r.title)+'">'+(e.r.start?'<span class="t">'+esc(e.r.start)+'</span>':'')+'<span class="n">'+esc(e.r.title||'Rendez-vous')+'</span></button>';
  const k=e.kind;const cls='ev'+(k!=='pub'?' prod':'')+(k==='pub'&&e.p.done?' done':'')+(isLate(e)?' late':'');
  const lead=k==='shoot'?'Tournage'+(e.dn>1?' '+(e.di+1)+'/'+e.dn:''):k==='edit'?'Montage':(e.time||'');
  const drag=k+':'+e.c.id+':'+(k==='pub'?e.p.id:k==='shoot'?e.s.id:'')+':'+e.date;
  const tip=(k==='pub'?accLabel(e.a)+' · ':lead+(k==='shoot'&&e.s.location?' · '+e.s.location:'')+' · ')+titleOf(e.c);
  return '<button class="'+cls+'" style="--c:'+evColor(e)+'" draggable="true" data-drag="ev:'+esc(drag)+'" data-act="peek" data-id="'+esc(e.c.id)+'" title="'+esc(tip)+'">'+
    (lead?'<span class="t">'+esc(lead)+'</span>':'')+'<span class="n">'+esc(titleOf(e.c))+'</span></button>';
}
function themePills(c){return (c.themes||[]).map(id=>themeOf(id)).filter(Boolean).map(t=>'<span class="pill plain">'+esc(t.label)+'</span>').join('');}
function rowActions(c,p){

    (isAdmin()?'<button class="icon-btn sm danger" data-act="del-content" data-id="'+esc(c.id)+'" data-confirm="Supprimer ?" title="Supprimer le contenu" aria-label="Supprimer le contenu">'+ICON.trash+'</button>':'')+'</div>';
}
function evRow(e,opts){
  if(e.kind==='rdv')return rdvRow(e.r,opts);
  opts=opts||{};const c=e.c;const t=typeOf(c.type);const late=isLate(e);

  if(e.kind==='pub')kindTag='<span class="pill" style="--c:'+accColor(e.a)+'"><span class="dot" style="--c:'+accColor(e.a)+'"></span>'+esc(e.a?platOf(e.a.platform).label+' · '+e.a.handle:pendingLabel(e.p))+'</span>';
  else if(e.kind==='shoot')kindTag='<span class="pill" style="--c:#E0533D">Tournage'+(e.dn>1?' · jour '+(e.di+1)+'/'+e.dn:'')+'</span>'+(e.s.location?'<span>📍 '+esc(e.s.location)+'</span>':'');
  else kindTag='<span class="pill plain">Montage</span>';
  const when=opts.showDate?'<div class="when'+(late?' late':'')+'"><b>'+pd(e.date).getDate()+'</b><span class="mono muted">'+MSHORT[pd(e.date).getMonth()]+'</span></div>':'';
  return '<div class="row">'+when+'<button class="row-main" data-act="peek" data-id="'+esc(c.id)+'"><b>'+esc(titleOf(c))+'</b><span class="row-meta">'+kindTag+
    '<span class="pill" style="--c:'+t.color+'">'+esc(t.label)+'</span>'+(e.time?'<span class="mono">'+esc(e.time)+'</span>':'')+
    (e.kind==='pub'&&e.p.done?'<span class="pill" style="--c:var(--ok)">Publié</span>':'')+
    (late?'<span style="color:var(--late);font-weight:600">En retard · '+rel(e.date)+'</span>':(opts.showRel?'<span>'+rel(e.date)+'</span>':''))+'</span></button>'+
    rowActions(c,e.kind==='pub'?e.p:null)+'</div>';
}
function contentRow(c){
  const t=typeOf(c.type),s=statusOf(c.status),np=nextPub(c);
  return '<div class="row"><button class="row-main" data-act="peek" data-id="'+esc(c.id)+'"><b>'+esc(titleOf(c))+'</b><span class="row-meta"><span class="pill" style="--c:'+s.c+'">'+s.label+'</span><span class="pill" style="--c:'+t.color+'">'+esc(t.label)+'</span>'+
    (np&&isValidDate(np.date)?'<span>'+esc(accLabel(S.accounts[np.accountId]))+' · '+fmtShort(np.date)+'</span>':'<span>Pas encore planifié</span>')+'</span></button>'+rowActions(c,null)+'</div>';
}

}

function homeList(sel){
  const t=today(),ws=weekStart(t),we=addDays(ws,6);
  const all=events({filtered:false,prod:false,rdv:false});const allR=events({filtered:false,prod:false,rdv:true});
  const cs=contents();
  if(sel==='week')return {title:'Cette semaine',items:events({filtered:false,prod:true,rdv:true}).filter(e=>e.date>=ws&&e.date<=we),kind:'ev',empty:'Rien de prévu cette semaine.'};
  if(sel==='late')return {title:'En retard',items:all.filter(isLate),kind:'ev',empty:'Aucune publication en retard.'};
  if(sel==='prod')return {title:'En cours',items:cs.filter(c=>['ecriture','production','tournage','montage','pret'].includes(c.status)).sort((a,b)=>STATUSES.findIndex(s=>s.id===a.status)-STATUSES.findIndex(s=>s.id===b.status)),kind:'c',empty:'Aucun contenu en cours.'};
  if(sel==='ideas')return {title:isAdmin()?'Propositions à traiter':'Mes idées à retravailler',items:ideasToHandle(),kind:'c',empty:isAdmin()?'Aucune proposition en attente.':'Rien à retravailler.'};
  if(sel&&sel.startsWith('day:')){const d=sel.slice(4);return {title:fmtDay(d),items:events({filtered:false,prod:true,rdv:true}).filter(e=>e.date===d),kind:'ev',empty:'Rien de prévu ce jour-là.',day:d};}
  return {title:'À venir · 14 jours',items:allR.filter(e=>e.date>=t&&e.date<=addDays(t,13)&&(e.kind==='rdv'||!e.p.done)),kind:'ev',empty:'Rien de planifié. Ajoute une diffusion à un contenu pour la voir ici.'};
}

/* ================= Vue : Calendrier ================= */
function viewCalendar(){
  const u=S.ui,t=today();const cur=u.cursor;const cd=pd(cur);
  let title;
  if(u.calMode==='week'){const ws=weekStart(cur),we=addDays(ws,6);title=fmtShort(ws)+' – '+fmtShort(we)+' '+pd(we).getFullYear();}
  else title=MONTHS[cd.getMonth()]+' '+cd.getFullYear();
  let h='<div class="wrap"><div class="head"><div><span class="label">Calendrier</span><h1>Planning de diffusion</h1></div><button class="btn primary" data-act="new" data-date="'+esc(u.selDay)+'">'+ICON.plus+'Planifier</button></div>';
  h+='<div class="cal-bar"><div class="cal-nav"><button class="icon-btn" data-act="cal-prev" aria-label="Précédent">'+ICON.left+'</button><button class="icon-btn" data-act="cal-next" aria-label="Suivant">'+ICON.right+'</button><span class="cal-title">'+esc(title)+'</span><button class="btn small" data-act="cal-today">Aujourd\'hui</button></div>'+
    '<div class="seg" role="group" aria-label="Vue">'+[['month','Mois'],['week','Semaine'],['list','Liste']].map(m=>'<button data-act="cal-mode" data-mode="'+m[0]+'" aria-pressed="'+(u.calMode===m[0])+'">'+m[1]+'</button>').join('')+'</div></div>';
  h+=filterBar('<label class="toggle"><input type="checkbox" id="show-prod" data-act-change="toggle-prod"'+(u.showProd?' checked':'')+'>Tournage &amp; montage</label><label class="toggle"><input type="checkbox" id="show-rdv" data-act-change="toggle-rdv"'+(u.showRdv?' checked':'')+'>Rendez-vous</label>');
  const evs=events();const bd=byDate(evs);
  if(u.calMode==='month'){
    const first=new Date(cd.getFullYear(),cd.getMonth(),1);const start=weekStart(ds(first));
    const last=ds(new Date(cd.getFullYear(),cd.getMonth()+1,0));const end=addDays(weekStart(last),6);
    h+='<div class="month">'+DAYS.map(x=>'<div class="dow">'+x+'</div>').join('');
    for(let day=start;day<=end;day=addDays(day,1)){
      const out=pd(day).getMonth()!==cd.getMonth();const list=bd[day]||[];
      h+='<div class="day'+(out?' out':'')+(day===t?' today':'')+(day===u.selDay?' sel':'')+'" data-act="sel-day" data-date="'+day+'" data-drop="'+day+'"><span class="num">'+pd(day).getDate()+'</span>'+
        list.slice(0,4).map(evChip).join('')+(list.length>4?'<span class="more">+'+(list.length-4)+'</span>':'')+'</div>';
    }
    h+='</div>';
    const sel=bd[u.selDay]||[];
    h+='<section class="panel daypanel"><div class="panel-h"><h2 style="text-transform:capitalize">'+esc(fmtDay(u.selDay))+'</h2><div class="row-acts"><button class="btn small" data-act="rdv-new" data-date="'+esc(u.selDay)+'">'+ICON.plus+'RDV</button><button class="btn small" data-act="new" data-date="'+esc(u.selDay)+'">'+ICON.plus+'Contenu</button></div></div>'+
      (sel.length?'<div class="rows">'+sel.map(e=>evRow(e)).join('')+'</div>':'<div class="empty"><b>Journée libre</b>Rien de prévu ce jour-là.</div>')+
      '<p class="hint" style="margin:10px 0 0">Sur ordinateur, glisse un élément vers un autre jour pour changer sa date.</p></section>';
  }else if(u.calMode==='week'){
    const ws=weekStart(cur);
    h+='<div class="week">';
    for(let i=0;i<7;i++){const day=addDays(ws,i);const list=bd[day]||[];
      h+='<div class="wcol'+(day===t?' today':'')+'" data-drop="'+day+'"><div class="wcol-h"><span class="label">'+DAYS_LONG[i]+'</span><b>'+pd(day).getDate()+'</b></div>'+
        list.map(evChip).join('')+'<button class="btn ghost small" data-act="new" data-date="'+day+'" aria-label="Planifier le '+esc(fmtDay(day))+'">'+ICON.plus+'</button></div>';}
    h+='</div>';
  }else{
    const ms=ds(new Date(cd.getFullYear(),cd.getMonth(),1)),me=ds(new Date(cd.getFullYear(),cd.getMonth()+1,0));
    const days=Object.keys(bd).filter(x=>x>=ms&&x<=me).sort();
    h+=days.length?'<div class="agenda">'+days.map(day=>'<div class="agenda-day"><div class="agenda-date"><b>'+pd(day).getDate()+'</b><span class="label">'+DAYS[dow(day)]+'</span></div><div class="panel" style="padding:6px 14px"><div class="rows">'+bd[day].map(e=>evRow(e)).join('')+'</div></div></div>').join('')+'</div>'
      :'<div class="empty"><b>Aucune publication ce mois-ci</b>'+(filtersActive()?'Essaie d\'effacer les filtres.':'Planifie un contenu pour remplir ton mois.')+'</div>';
  }
  return h+'</div>';
}

/* ================= Vue : Contenus ================= */
function nextPub(c){const t=today();const ps=(c.publications||[]).filter(p=>isValidDate(p.date)).sort((a,b)=>a.date<b.date?-1:1);return ps.find(p=>!p.done&&p.date>=t)||ps.find(p=>!p.done)||ps[ps.length-1];}
function accChips(c,max){
  max=max||3;const ps=(c.publications||[]);if(!ps.length)return '<span class="chip-acc">Pas encore planifié</span>';
  return ps.slice(0,max).map(p=>{const a=S.accounts[p.accountId];const late=!p.done&&isValidDate(p.date)&&p.date<today();
    return '<span class="chip-acc'+(late?' late':'')+'"><span class="dot" style="--c:'+accColor(a)+'"></span>'+esc(accLabel(a))+(isValidDate(p.date)?' · '+fmtShort(p.date):'')+(p.done?' ✓':'')+'</span>';}).join('')+(ps.length>max?'<span class="chip-acc">+'+(ps.length-max)+'</span>':'');
}
function matchSearch(c){const q=S.ui.search.trim().toLowerCase();if(!q)return true;
  return [c.title,c.notes,c.caption,c.hashtags,c.cast,(c.shoots||[]).map(s=>s.location+' '+s.note).join(' '),(c.themes||[]).map(id=>(themeOf(id)||{}).label).join(' '),(c.scenes||[]).map(s=>s.heading+' '+s.body).join(' ')].join(' ').toLowerCase().includes(q);}

  h+='<div class="cal-bar"><div class="search">'+ICON.search+'<input class="inp" id="search" type="search" placeholder="Rechercher titre, script, hashtag…" value="'+esc(u.search)+'" data-input="search"></div>'+
    '<div class="seg" role="group" aria-label="Affichage">'+[['board','Tableau'],['list','Liste']].map(m=>'<button data-act="list-mode" data-mode="'+m[0]+'" aria-pressed="'+(u.listMode===m[0])+'">'+m[1]+'</button>').join('')+'</div></div>';
  h+=filterBar();
  if(!contents().length){return h+'<div class="empty"><b>Aucun contenu pour l\'instant</b>Crée ton premier skit, podcast ou concept.<br><button class="btn primary" data-act="new" data-status="ecriture">Créer un contenu</button></div></div>';}
  if(u.listMode==='board'){

    const ideasN=list.filter(c=>c.status==='idee').length;

        cs.map(card).join('')+(cs.length?'':'<p class="hint" style="margin:6px 4px">Glisse un contenu ici ou utilise la flèche d\'une carte.</p>')+'</div>';}).join('')+'</div>';
    if(ideasN&&u.filters.status!=='idee')h+='<p class="hint" style="margin:0">'+plural(ideasN,'idée')+' en attente dans <button class="btn ghost small" data-nav="ideas">la banque d\'idées</button></p>';
  }else{
    h+=list.length?'<div class="table-wrap"><table><thead><tr><th>Titre</th><th>Format</th><th>Thématiques</th><th>Statut</th><th>Distribution</th><th>Diffusion</th><th>Prochaine date</th></tr></thead><tbody>'+
      list.map(c=>{const t=typeOf(c.type),s=statusOf(c.status),np=nextPub(c);
        return '<tr data-act="open" data-id="'+esc(c.id)+'"><td><b>'+esc(titleOf(c))+'</b></td><td><span class="pill" style="--c:'+t.color+'">'+esc(t.label)+'</span></td><td><div class="card-f">'+(themePills(c)||'<span class="muted">—</span>')+'</div></td><td><span class="pill" style="--c:'+s.c+'">'+s.label+'</span></td><td>'+(distLabel(c)?esc(distLabel(c)):'<span class="muted">—</span>')+'</td><td><div class="card-f">'+accChips(c,2)+'</div></td><td class="mono">'+(np&&isValidDate(np.date)?fmtShort(np.date)+(np.time?' · '+esc(np.time):''):'—')+'</td></tr>';}).join('')+'</tbody></table></div>'

function nextShootLabel(c){const t=today();const s=(c.shoots||[]).filter(x=>isValidDate(x.start)&&shootEnd(x)>=t).sort((a,b)=>a.start<b.start?-1:1)[0];return s?'Tournage '+fmtShoot(s)+((c.shoots||[]).length>1?' · '+c.shoots.length+' sessions':''):'';}
function card(c){

/* ================= Vue : Idées (propositions & validation) ================= */
const IDEA_STATES={proposee:{label:'En attente',c:'#5B6CFF'},atravailler:{label:'À retravailler',c:'#C98C00'},validee:{label:'Validée',c:'#14A37F'},refusee:{label:'Refusée',c:'#D2402C'}};
let reviewing=null;
const allIdeas=()=>contents().filter(c=>c.status==='idee').sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
function ideasToHandle(){return isAdmin()?allIdeas().filter(c=>c.ideaState==='proposee'):allIdeas().filter(c=>c.author==='assistant'&&c.ideaState==='atravailler');}
function canEditIdea(c){return isAdmin()||(c.author==='assistant'&&['proposee','atravailler'].includes(c.ideaState));}
function canDeleteIdea(c){return isAdmin()||c.author==='assistant';}
function normUrl(u){u=String(u||'').trim();if(!u)return '';return /^https?:\/\//i.test(u)?u:'https://'+u;}
function linkInfo(u){let h='';try{h=new URL(normUrl(u)).hostname.replace(/^www\.|^m\./,'');}catch(e){return {label:'Lien',ok:false};}
  const m=[['tiktok.com','TikTok'],['youtube.com','YouTube'],['youtu.be','YouTube'],['instagram.com','Instagram'],['facebook.com','Facebook'],['fb.watch','Facebook'],['x.com','X'],['twitter.com','X'],['pinterest.','Pinterest'],['vimeo.com','Vimeo'],['threads.net','Threads'],['snapchat.com','Snapchat']].find(x=>h.includes(x[0]));
  return {label:m?m[1]:h,ok:true};}
function linksHtml(c){const ls=(c.links||[]).filter(l=>l.url&&l.url.trim());if(!ls.length)return '';
  return '<div class="links">'+ls.map(l=>{const i=linkInfo(l.url);return '<a class="link-chip" href="'+esc(normUrl(l.url))+'" target="_blank" rel="noopener" title="'+esc(l.url)+'">↗ '+esc(i.label)+'</a>';}).join('')+'</div>';}
function targetChips(c){return (c.targets||[]).map(id=>{const a=S.accounts[id];return a?'<span class="chip-acc"><span class="dot" style="--c:'+accColor(a)+'"></span>'+esc(platOf(a.platform).label)+' · '+esc(a.handle)+'</span>':'';}).join('');}
function ideaCard(c){
  const t=typeOf(c.type);const st=IDEA_STATES[c.ideaState]||IDEA_STATES.validee;
  let h='<div class="idea'+(c.ideaState==='proposee'&&isAdmin()?' proposee':'')+'">';
  h+='<div class="card-b"><div class="card-f"><span class="pill" style="--c:'+t.color+'">'+esc(t.label)+'</span>'+themePills(c)+'</div><span class="pill" style="--c:'+st.c+'">'+st.label+'</span></div>';
  h+='<b class="card-t">'+esc(titleOf(c))+'</b>';
  h+='<span class="by">'+(c.author==='assistant'?'Proposée par '+esc(c.authorName||roleName('assistant')):'Idée de l\'admin')+(c.createdAt?' · '+fmtStamp(c.createdAt):'')+'</span>';
  if(c.notes)h+='<p>'+esc(c.notes)+'</p>';
  if((c.targets||[]).length)h+='<div class="card-f">'+targetChips(c)+'</div>';
  h+=linksHtml(c);
  if(c.review&&c.review.comment&&['atravailler','refusee'].includes(c.ideaState))h+='<div class="review '+c.ideaState+'"><b>'+(c.ideaState==='refusee'?'Refusée parce que':'À retravailler')+'</b>'+esc(c.review.comment)+'</div>';
  if(reviewing&&reviewing.id===c.id){
    h+='<form class="field" data-form="review" data-id="'+esc(c.id)+'" data-kind="'+reviewing.kind+'"><span>'+(reviewing.kind==='refusee'?'Pourquoi tu refuses ?':'Qu\'est-ce qu\'il faut retravailler ?')+'</span><textarea class="inp" id="rv-'+esc(c.id)+'" rows="2" placeholder="'+(reviewing.kind==='refusee'?'Ex. : trop proche du skit de mars':'Ex. : trouve une chute plus forte')+'"></textarea><div class="card-b"><button type="button" class="btn small ghost" data-act="idea-review-cancel">Annuler</button><button class="btn small primary" type="submit">Envoyer</button></div></form>';
  }
  const acts=[];
  if(isAdmin()){
    if(c.ideaState!=='validee')acts.push('<button class="btn small primary" data-act="idea-validate" data-id="'+esc(c.id)+'">'+ICON.check+'Valider</button>');
    if(c.ideaState==='proposee'){acts.push('<button class="btn small" data-act="idea-review" data-kind="atravailler" data-id="'+esc(c.id)+'">À retravailler</button>');acts.push('<button class="btn small danger" data-act="idea-review" data-kind="refusee" data-id="'+esc(c.id)+'">Refuser</button>');}
    if(c.ideaState==='validee')acts.push('<button class="btn small primary" data-act="idea-promote" data-id="'+esc(c.id)+'">En écriture'+ICON.arrow+'</button>');
  }
  acts.push('<button class="btn small ghost" data-act="idea-open" data-id="'+esc(c.id)+'">'+(canEditIdea(c)?(c.ideaState==='atravailler'&&!isAdmin()?'Retravailler':'Modifier'):'Voir')+'</button>');
  if(canDeleteIdea(c))acts.push('<button class="icon-btn sm danger" data-act="idea-del" data-id="'+esc(c.id)+'" data-confirm="Supprimer ?" aria-label="Supprimer l\'idée">'+ICON.trash+'</button>');
  h+='<div class="card-f" style="margin-top:auto">'+acts.join('')+'</div></div>';
  return h;
}
function ideaSection(title,list,empty,hint,fold){
  if(fold)return list.length?'<details class="fold" id="fold-'+esc(title.replace(/\W+/g,''))+'"><summary>'+esc(title)+' ('+list.length+')</summary><div class="idea-cols" style="margin-top:10px">'+list.map(ideaCard).join('')+'</div></details>':'';
  return '<section class="chan"><div class="chan-h"><h2>'+esc(title)+'</h2><span class="mono muted">'+list.length+'</span>'+(hint?'<span class="hint">'+esc(hint)+'</span>':'')+'</div>'+
    (list.length?'<div class="idea-cols">'+list.map(ideaCard).join('')+'</div>':'<div class="empty" style="padding:16px">'+esc(empty)+'</div>')+'</section>';
}
function viewIdeas(){
  const all=allIdeas();const admin=isAdmin();
  let h='<div class="wrap"><div class="head"><div><span class="label">Banque d\'idées</span><h1>'+(admin?'Idées':'Proposer des idées')+'</h1><p class="muted">'+(admin?'Valide les propositions, renvoie-les à retravailler ou refuse-les avec un mot. Les idées validées passent ensuite en écriture.':'Propose tes idées avec les comptes visés et des liens de référence. L\'admin les valide ou te les renvoie avec un commentaire.')+'</p></div>'+
    '<button class="btn primary" data-act="idea-new">'+ICON.plus+(admin?'Idée détaillée':'Proposition détaillée')+'</button></div>';
  h+='<form class="quick" data-form="idea"><input class="inp" id="qi" placeholder="Ex. : skit sur les taxi-be aux heures de pointe" autocomplete="off" aria-label="Nouvelle idée">'+
    '<select class="inp" id="qi-type" aria-label="Format">'+settings().types.map(t=>'<option value="'+esc(t.id)+'"'+(t.id===S.ui.ideaType?' selected':'')+'>'+esc(t.label)+'</option>').join('')+'</select>'+
    '<button class="btn" type="submit">'+ICON.plus+(admin?'Ajouter':'Proposer')+'</button></form>';
  if(admin){
    h+=ideaSection('À traiter',all.filter(c=>c.ideaState==='proposee'),'Aucune proposition en attente.','Proposées par '+roleName('assistant'));
    h+=ideaSection('Validées',all.filter(c=>c.ideaState==='validee'),'Aucune idée validée pour l\'instant.','Prêtes à passer en écriture');
    h+=ideaSection('Renvoyées à retravailler',all.filter(c=>c.ideaState==='atravailler'),'Rien en cours de reprise.','');
    h+=ideaSection('Refusées',all.filter(c=>c.ideaState==='refusee'),'','',true);
  }else{
    const mine=all.filter(c=>c.author==='assistant');
    h+=ideaSection('À retravailler',mine.filter(c=>c.ideaState==='atravailler'),'Rien à retravailler pour l\'instant.','Lis le commentaire, modifie et renvoie');
    h+=ideaSection('En attente de validation',mine.filter(c=>c.ideaState==='proposee'),'Aucune proposition en attente.','');

async function hashPin(pin){const txt='studio-tefi:'+pin;
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
  catch(e){let h=5381;for(const ch of txt)h=((h<<5)+h+ch.charCodeAt(0))|0;return 'w'+(h>>>0).toString(16);}}

function accUrl(a){if(!a)return '';if(a.url)return a.url;const h=String(a.handle||'').replace(/^@/,'');if(!h||!isSocial(a.platform))return '';
  const k=(a.platform+' '+platOf(a.platform).label).toLowerCase();
  if(k.includes('instagram'))return 'https://www.instagram.com/'+encodeURIComponent(h)+'/';
  if(k.includes('tiktok'))return 'https://www.tiktok.com/@'+encodeURIComponent(h);
  if(k.includes('facebook'))return 'https://www.facebook.com/'+encodeURIComponent(h);
  if(k.includes('youtube'))return 'https://www.youtube.com/@'+encodeURIComponent(h);
  return '';}
function composerUrl(a){if(!a)return '';const k=(a.platform+' '+platOf(a.platform).label).toLowerCase();
  if(k.includes('facebook')||k.includes('instagram'))return 'https://business.facebook.com/latest/composer';
  if(k.includes('tiktok'))return 'https://www.tiktok.com/tiktokstudio/upload';
  if(k.includes('youtube'))return 'https://studio.youtube.com';
  return accUrl(a);}

function cp1252(s){let o='';for(const ch of String(s==null?'':s)){let c=ch.codePointAt(0);if(c===0x202F||c===0xA0||c===9)c=32;
  if(c===10||c===13){o+=' ';continue;}if(c>=32&&c<127||(c>=0xA0&&c<=0xFF))o+=String.fromCharCode(c);else if(CP1252X[c])o+=String.fromCharCode(CP1252X[c]);else o+='?';}return o;}
class MiniPDF{
  constructor(){this.k=72/25.4;this.pages=[];this.images=[];this.newPage();}
  newPage(){this.cur=[];this.pages.push(this.cur);}
  Y(y){return ((297-y)*this.k).toFixed(2);}
  X(x){return (x*this.k).toFixed(2);}
  rgb(c){c=String(c||'#000').replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');const n=parseInt(c,16);return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255].map(v=>v.toFixed(3)).join(' ');}
  width(t,font,size){const w=font==='F2'?HELVB_W:HELV_W;const s=cp1252(t);let a=0;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a+=(c>=32&&c<=255?w[c-32]:556);}return a/1000*size/this.k;}
  text(t,x,y,o){o=o||{};const f=o.font||'F1',sz=o.size||10;const s=cp1252(t);let xx=x;if(o.align==='right')xx=x-this.width(t,f,sz);else if(o.align==='center')xx=x-this.width(t,f,sz)/2;
    const e=s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
    this.cur.push('BT /'+f+' '+sz+' Tf '+this.rgb(o.color||'#1d1c25')+' rg '+this.X(xx)+' '+this.Y(y)+' Td ('+e+') Tj ET');}
  rect(x,y,w,h,fill,stroke){let s='';if(fill)s+=this.rgb(fill)+' rg ';if(stroke)s+=this.rgb(stroke)+' RG 0.3 w ';s+=this.X(x)+' '+((297-y-h)*this.k).toFixed(2)+' '+(w*this.k).toFixed(2)+' '+(h*this.k).toFixed(2)+' re '+(fill&&stroke?'B':fill?'f':'S');this.cur.push(s);}
  line(x1,y1,x2,y2,c,w){this.cur.push(this.rgb(c||'#ccc')+' RG '+((w||0.3)*this.k/2.83).toFixed(2)+' w '+this.X(x1)+' '+this.Y(y1)+' m '+this.X(x2)+' '+this.Y(y2)+' l S');}
  addJpeg(dataUrl,pw,ph){const b=atob(String(dataUrl).split(',')[1]||'');this.images.push({data:b,w:pw,h:ph});return 'Im'+this.images.length;}
  image(name,x,y,w,h){this.cur.push('q '+(w*this.k).toFixed(2)+' 0 0 '+(h*this.k).toFixed(2)+' '+this.X(x)+' '+((297-y-h)*this.k).toFixed(2)+' cm /'+name+' Do Q');}
  wrap(t,maxW,font,size){const out=[];String(t==null?'':t).split(/\n/).forEach(par=>{const words=par.split(/ +/);let line='';
      words.forEach(w=>{const test=line?line+' '+w:w;if(this.width(test,font,size)<=maxW||!line)line=test;else{out.push(line);line=w;}
        while(this.width(line,font,size)>maxW&&line.length>1){let i=line.length;while(i>1&&this.width(line.slice(0,i),font,size)>maxW)i--;out.push(line.slice(0,i));line=line.slice(i);}});
      out.push(line);});return out;}
  output(){
    const objs=[];const add=s=>{objs.push(s);return objs.length;};
    add('<< /Type /Catalog /Pages 2 0 R >>');add('PAGES');
    const fonts=[['F1','Helvetica'],['F2','Helvetica-Bold'],['F3','Helvetica-Oblique']].map(f=>[f[0],add('<< /Type /Font /Subtype /Type1 /BaseFont /'+f[1]+' /Encoding /WinAnsiEncoding >>')]);
    const ims=this.images.map((im,i)=>['Im'+(i+1),add('<< /Type /XObject /Subtype /Image /Width '+im.w+' /Height '+im.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+im.data.length+' >>\nstream\n'+im.data+'\nendstream')]);
    const res='<< /Font << '+fonts.map(f=>'/'+f[0]+' '+f[1]+' 0 R').join(' ')+' >>'+(ims.length?' /XObject << '+ims.map(i=>'/'+i[0]+' '+i[1]+' 0 R').join(' ')+' >>':'')+' >>';
    const kids=[];
    this.pages.forEach(pg=>{const c=pg.join('\n');const cid=add('<< /Length '+c.length+' >>\nstream\n'+c+'\nendstream');kids.push(add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources '+res+' /Contents '+cid+' 0 R >>'));});
    objs[1]='<< /Type /Pages /Kids ['+kids.map(k=>k+' 0 R').join(' ')+'] /Count '+kids.length+' >>';
    let out='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';const offs=[];
    objs.forEach((o,i)=>{offs.push(out.length);out+=(i+1)+' 0 obj\n'+o+'\nendobj\n';});
    const x=out.length;out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('');
    out+='trailer\n<< /Size '+(objs.length+1)+' /Root 1 0 R >>\nstartxref\n'+x+'\n%%EOF';
    const bytes=new Uint8Array(out.length);for(let i=0;i<out.length;i++)bytes[i]=out.charCodeAt(i)&255;
    return new Blob([bytes],{type:'application/pdf'});
  }
}

/* ================= Facturation : devis & factures ================= */
const BILL_TABS=['fac','dev','presta','prof'];
const CURRENCIES={MGA:{label:'Ariary (Ar)',sym:'Ar',dec:0,word:'ariary',sub:''},EUR:{label:'Euro (€)',sym:'€',dec:2,word:'euro',sub:'centime'},USD:{label:'Dollar US ($)',sym:'$',dec:2,word:'dollar',sub:'cent'}};
const UNITS=['forfait','jour','demi-journée','heure','vidéo','post','épisode','mois','unité'];
const DOC_STATUS={devis:[['brouillon','Brouillon','#8A8FA3'],['envoye','Envoyé','#5B6CFF'],['accepte','Accepté','#14A37F'],['refuse','Refusé','#D2402C']],
  facture:[['brouillon','Brouillon','#8A8FA3'],['envoyee','Envoyée','#5B6CFF'],['payee','Payée','#14A37F'],['annulee','Annulée','#5D6472']]};
const profiles=()=>settings().profiles;const prestations=()=>settings().prestations;
const profOf=id=>profiles().find(p=>p.id===id);
const docs=()=>Object.values(S.docs);
function money(n,cur){const c=CURRENCIES[cur]||CURRENCIES.MGA;n=+n||0;const neg=n<0;n=Math.abs(n);let [i,d]=n.toFixed(c.dec).split('.');i=i.replace(/\B(?=(\d{3})+(?!\d))/g,' ');const s=(neg?'-':'')+i+(d?','+d:'');return cur==='USD'?'$ '+s:s+' '+c.sym;}
function docTotals(d){const sub=(d.lines||[]).reduce((t,l)=>t+(+l.qty||0)*(+l.price||0),0);const disc=sub*(+d.discount||0)/100;const base=sub-disc;const tax=base*(+d.taxRate||0)/100;return {sub,disc,base,tax,total:base+tax};}
function docState(d){if(d.kind==='facture'&&d.status==='envoyee'&&isValidDate(d.dueDate)&&d.dueDate<today())return ['retard','En retard','#D2402C'];const L=DOC_STATUS[d.kind]||DOC_STATUS.facture;return L.find(x=>x[0]===d.status)||L[0];}
function nextNumber(kind,profileId,date){const p=profOf(profileId)||{};const pre=(kind==='devis'?(p.prefixD||'DEV'):(p.prefixF||'FAC'))+'-'+String(date||today()).slice(0,4)+'-';let max=0;
  docs().forEach(d=>{if(d.kind===kind&&d.profileId===profileId&&String(d.number||'').startsWith(pre)){const n=parseInt(String(d.number).slice(pre.length),10);if(n>max)max=n;}});return pre+String(max+1).padStart(3,'0');}
function partySnap(x){return x?{name:x.label||x.name||'',activity:x.activity||'',phone:x.phone||'',email:x.email||'',nif:x.nif||'',stat:x.stat||'',rcs:x.rcs||'',address:x.address||'',country:x.country||'',contact:x.contact||'',payment:x.payment||'',color:x.color||''}:null;}
const fmtFr=s=>isValidDate(s)?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'';
function frWords(n){n=Math.floor(Math.abs(n));if(n===0)return 'zéro';
  const U=['','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
  const T=['','dix','vingt','trente','quarante','cinquante','soixante','soixante','quatre-vingt','quatre-vingt'];
  const b100=n=>{if(n<20)return U[n];const t=Math.floor(n/10),u=n%10;if(t===7||t===9)return T[t]+(t===7&&u===1?' et ':'-')+U[10+u];if(u===0)return T[t]+(t===8?'s':'');if(u===1&&t<8)return T[t]+' et un';return T[t]+'-'+U[u];};
  const b1000=n=>{const c=Math.floor(n/100),r=n%100;let s='';if(c)s=(c>1?U[c]+' cent':'cent')+(c>1&&r===0?'s':'');if(r)s+=(s?' ':'')+b100(r);return s;};
  let s='';for(const [v,w] of [[1e9,'milliard'],[1e6,'million'],[1000,'mille']]){const q=Math.floor(n/v);if(q){if(w==='mille')s+=(q===1?'mille':b1000(q).replace(/(cent|vingt)s$/,'$1')+' mille')+' ';else s+=b1000(q)+' '+w+(q>1?'s':'')+' ';n%=v;}}
  if(n)s+=b1000(n);return s.trim();}
function amountWords(total,cur){const c=CURRENCIES[cur]||CURRENCIES.MGA;const ent=Math.floor(Math.abs(total)+1e-9);let s=frWords(ent)+' '+c.word+(ent>1&&cur!=='MGA'?'s':'');
  if(c.dec){const cents=Math.round((Math.abs(total)-ent)*100);if(cents)s+=' et '+frWords(cents)+' '+c.sub+(cents>1?'s':'');}return s.charAt(0).toUpperCase()+s.slice(1);}
function sumBy(list,f){const m={};list.forEach(d=>{const c=d.currency||'MGA';m[c]=(m[c]||0)+f(d);});const ks=Object.keys(m).filter(k=>Math.abs(m[k])>0.0001);return ks.length?ks.map(k=>money(m[k],k)).join(' + '):money(0,'MGA');}

/* ----- Listes ----- */
function docRow(d){const st=docState(d);const t=docTotals(d);const cl=d.clientSnap&&d.clientSnap.name||(compOf(d.companyId)||{}).label||'Sans client';
  return '<tr data-act="doc-open" data-id="'+esc(d.id)+'"><td class="mono"><b>'+esc(d.number)+'</b></td><td>'+esc(cl)+(d.subject?'<div class="hint">'+esc(d.subject)+'</div>':'')+'</td><td class="mono">'+fmtShort(d.date)+'</td><td class="mono">'+(isValidDate(d.dueDate)?fmtShort(d.dueDate):'—')+'</td><td class="mono" style="text-align:right;white-space:nowrap"><b>'+esc(money(t.total,d.currency))+'</b></td><td><span class="pill" style="--c:'+st[2]+'">'+st[1]+'</span></td>'+
    '<td><div class="row-acts"><button class="btn small" data-act="doc-pdf" data-id="'+esc(d.id)+'" title="Exporter en PDF">PDF</button></div></td></tr>';}
function billingTab(tab){
  if(!isAdmin())return '<div class="empty"><b>Réservé à l\'admin</b>La facturation n\'est pas accessible dans la vue assistante.</div>';
  if(tab==='prof')return viewProfiles();
  if(tab==='presta')return viewPrestations();
  if(!profiles().length)return '<div class="empty"><b>Commence par le profil de ton entreprise</b>Nom, téléphone, mail, NIF, STAT, RCS, adresse et pays : tu les remplis une fois, ils apparaissent ensuite sur tous tes devis et factures.<br><button class="btn primary" data-act="biz-tab" data-tab="prof">Créer mon profil d\'entreprise</button></div>';
  const kind=tab==='dev'?'devis':'facture';const f=S.ui.docFilter||{};
  let list=docs().filter(d=>d.kind===kind).sort((a,b)=>(b.date+b.number)>(a.date+a.number)?1:-1);
  if(f.status)list=list.filter(d=>docState(d)[0]===f.status);if(f.profile)list=list.filter(d=>d.profileId===f.profile);if(f.client)list=list.filter(d=>d.companyId===f.client);
  let h='';
  if(kind==='facture'){
    const all=docs().filter(d=>d.kind==='facture'&&d.status!=='annulee'&&d.status!=='brouillon');const t=today();const ms=t.slice(0,7);
    const month=all.filter(d=>String(d.date).slice(0,7)===ms);const paidM=all.filter(d=>d.status==='payee'&&String(d.paidAt||d.date).slice(0,7)===ms);
    const open=all.filter(d=>d.status==='envoyee');const late=open.filter(d=>docState(d)[0]==='retard');
    h+='<div class="stats" style="grid-template-columns:repeat(4,minmax(0,1fr))"><div class="stat"><span class="label">Facturé ce mois</span><strong style="font-size:20px">'+esc(sumBy(month,d=>docTotals(d).total))+'</strong><span class="muted">'+plural(month.length,'facture')+'</span></div>'+
      '<div class="stat"><span class="label">Encaissé ce mois</span><strong style="font-size:20px;color:var(--ok)">'+esc(sumBy(paidM,d=>docTotals(d).total))+'</strong><span class="muted">'+plural(paidM.length,'facture')+' payée'+(paidM.length>1?'s':'')+'</span></div>'+
      '<div class="stat"><span class="label">À encaisser</span><strong style="font-size:20px">'+esc(sumBy(open,d=>docTotals(d).total))+'</strong><span class="muted">'+plural(open.length,'facture')+' envoyée'+(open.length>1?'s':'')+'</span></div>'+
      '<div class="stat'+(late.length?' alert':'')+'"><span class="label">En retard</span><strong style="font-size:20px">'+esc(sumBy(late,d=>docTotals(d).total))+'</strong><span class="muted">'+plural(late.length,'facture')+'</span></div></div>';
  }
  const opt=(v,l,sel)=>'<option value="'+esc(v)+'"'+(sel===v?' selected':'')+'>'+esc(l)+'</option>';
  const sts=(DOC_STATUS[kind]).concat(kind==='facture'?[['retard','En retard']]:[]);
  h+='<div class="cal-bar"><div class="filters">'+
    '<select class="inp'+(f.status?' on':'')+'" id="df-status" data-docf="status" aria-label="Statut">'+opt('','Tous les statuts',f.status)+sts.map(s=>opt(s[0],s[1],f.status)).join('')+'</select>'+
    (profiles().length>1?'<select class="inp'+(f.profile?' on':'')+'" id="df-profile" data-docf="profile" aria-label="Entreprise">'+opt('','Toutes mes entreprises',f.profile)+profiles().map(p=>opt(p.id,p.name,f.profile)).join('')+'</select>':'')+
    '<select class="inp'+(f.client?' on':'')+'" id="df-client" data-docf="client" aria-label="Client">'+opt('','Tous les clients',f.client)+companies().map(c=>opt(c.id,c.label,f.client)).join('')+'</select></div>'+
    '<button class="btn primary" data-act="doc-new" data-kind="'+kind+'">'+ICON.plus+(kind==='devis'?'Nouveau devis':'Nouvelle facture')+'</button></div>';
  h+=list.length?'<div class="table-wrap"><table><thead><tr><th>N°</th><th>Client</th><th>Date</th><th>'+(kind==='devis'?'Validité':'Échéance')+'</th><th style="text-align:right">Montant</th><th>Statut</th><th></th></tr></thead><tbody>'+list.map(docRow).join('')+'</tbody></table></div>'
    :'<div class="empty"><b>'+(kind==='devis'?'Aucun devis':'Aucune facture')+'</b>'+(Object.values(f).some(Boolean)?'Change les filtres.':'Crée ton premier '+(kind==='devis'?'devis':'document')+' : les prestations, la TVA et le total se calculent tout seuls.')+'</div>';
  if(kind==='facture'){
    const yr=today().slice(0,4);const inv=docs().filter(d=>d.kind==='facture'&&d.status!=='annulee'&&d.status!=='brouillon'&&String(d.date).startsWith(yr));
    const per={};inv.forEach(d=>{const k=d.companyId||'_';(per[k]=per[k]||[]).push(d);});
    const keys=Object.keys(per);
    if(keys.length)h+='<section class="panel"><div class="panel-h"><h2>Revenus '+yr+' par client</h2></div><div>'+keys.map(k=>{const c=compOf(k);const L=per[k];
      return '<div class="acc-row"><span class="acc-name"><span class="dot" style="--c:'+(c?c.color:'#8A8FA3')+'"></span><span>'+esc(c?c.label:'Sans client')+'</span></span><div class="kv"><b>'+esc(sumBy(L,d=>docTotals(d).total))+'</b>facturé</div><div class="kv"><b>'+esc(sumBy(L.filter(d=>d.status==='payee'),d=>docTotals(d).total))+'</b>encaissé</div></div>';}).join('')+'</div></section>';
  }
  return h;
}
const PROF_FIELDS=[['name','Nom de l\'entreprise *'],['activity','Activité'],['phone','Téléphone'],['email','E-mail'],['nif','NIF'],['stat','STAT'],['rcs','RCS'],['address','Adresse'],['country','Pays']];

        '<div class="field wide"><span>Logo</span><div class="set-item">'+(p.logo?'<img src="'+esc(p.logo)+'" alt="Logo" style="height:44px;width:auto;border:1px solid var(--line);border-radius:6px;background:#fff;padding:3px">':'<span class="hint">Aucun logo</span>')+
          '<label class="btn small" style="cursor:pointer">Choisir une image<input type="file" accept="image/*" data-prof-logo="'+esc(p.id)+'" hidden></label>'+(p.logo?'<button class="btn small ghost" data-act="prof-nologo" data-id="'+esc(p.id)+'">Retirer</button>':'')+'</div></div>'+

  h+='<section class="panel"><h3>'+(profiles().length?'Ajouter une autre entreprise':'Crée le profil de ton entreprise')+'</h3><form class="add-form" data-form="prof"><input class="inp" id="prof-new" placeholder="Nom de l\'entreprise" autocomplete="off"><button class="btn primary" type="submit">'+ICON.plus+'Créer le profil</button></form><p class="hint" style="margin:8px 0 0">Tu complètes ensuite le numéro, le mail, le NIF, le STAT, le RCS, l\'adresse et le pays.</p></section>';
  return h;
}
function viewPrestations(){
  let h='<p class="muted" style="margin:0">Ton catalogue de prestations. Tu les ajoutes en un clic dans tes devis et factures, et tu peux toujours modifier le prix sur le document.</p>';
  h+=prestations().length?'<div class="table-wrap"><table style="min-width:620px"><thead><tr><th>Prestation</th><th>Unité</th><th style="text-align:right">Prix</th><th>Devise</th><th></th></tr></thead><tbody>'+prestations().map(x=>'<tr style="cursor:default">'+
      '<td><input class="inp" id="ps-l-'+esc(x.id)+'" value="'+esc(x.label)+'" data-presta="label" data-id="'+esc(x.id)+'" aria-label="Nom"><input class="inp" style="margin-top:6px;font-size:13px" id="ps-d-'+esc(x.id)+'" value="'+esc(x.desc||'')+'" data-presta="desc" data-id="'+esc(x.id)+'" placeholder="Détail (facultatif)" aria-label="Détail"></td>'+
      '<td><select class="inp" id="ps-u-'+esc(x.id)+'" data-presta="unit" data-id="'+esc(x.id)+'" aria-label="Unité">'+UNITS.map(u=>'<option'+(u===x.unit?' selected':'')+'>'+u+'</option>').join('')+'</select></td>'+

  docDraft=id&&S.docs[id]?clone(S.docs[id]):newDoc(preset&&preset.kind||'facture',preset);docOrig=id&&S.docs[id]?clone(S.docs[id]):null;

function saveDoc(silent){
  const d=clone(docDraft);if(!d)return null;
  const isNew=!S.docs[d.id];const blank=!d.lines.some(l=>l.label.trim()||+l.price)&&!d.companyId&&!d.subject;
  if(isNew&&blank)return null;
  if(d.status==='brouillon'||!d.profileSnap){const p=profOf(d.profileId);d.profileSnap=partySnap(p?Object.assign({},p,{label:p.name}):null);}
  if(d.status==='brouillon'||!d.clientSnap){d.clientSnap=partySnap(compOf(d.companyId));}
  if(!isNew&&docOrig&&JSON.stringify(Object.assign({},d,{updatedAt:0}))===JSON.stringify(Object.assign({},docOrig,{updatedAt:0})))return d;
  d.updatedAt=Date.now();S.docs[d.id]=d;
  if(S.mode==='cloud')enqueue('d:'+d.id,()=>DB.collection('docs').doc(d.id).set(clone(d)));else persistLocal();
  logChange('doc',isNew?'create':'update',d.id,(d.kind==='devis'?'Devis ':'Facture ')+d.number,isNew?'Créé · '+money(docTotals(d).total,d.currency):'Modifié · '+money(docTotals(d).total,d.currency),isNew?null:docOrig);
  docOrig=clone(d);docDraft=clone(d);scheduleRender();if(!silent)toast((d.kind==='devis'?'Devis ':'Facture ')+d.number+' enregistré'+(d.kind==='facture'?'e':''));return d;
}
